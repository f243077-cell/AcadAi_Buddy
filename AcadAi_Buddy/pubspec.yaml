name: study_ai_app
description: AcadAI Buddy - Flutter Study Companion
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5

  # Routing
  go_router: ^14.6.3

  # UI, Markdown & LaTeX
  google_fonts: ^8.2.1
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  flutter_math_fork: ^0.7.4

  # Functional Programming
  dartz: ^0.10.1

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  http: ^1.6.0

  # Image
  image_picker: ^1.1.2

  # Environment
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env